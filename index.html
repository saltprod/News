<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Telegram MiniApp — Моя лента</title>
  <style>
    :root{
      --bg:#071022; --surface:#081426; --text:#e6eef8; --muted:#9fb3d6; --accent:#2a8cff;
      --accent-rgb:42,140,255; --btn-alpha:0.12;
      --header-h:120px; /* fallback before JS measures the real header height */
      /* Space reserved for the device notch/status bar AND Telegram's own Mini App bar
         (its close/expand/menu controls) — 0 outside Telegram, set from JS via
         Telegram.WebApp.safeAreaInset / contentSafeAreaInset once available. */
      --tg-safe-top:0px;
    }
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial}
    body{background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
    .app{position:relative;z-index:2;max-width:960px;margin:0 auto;padding-top:var(--header-h)}
    /* Side control panel keeps buttons out of the news column */
    .side-panel{position:fixed;left:12px;top:calc(var(--header-h) + 8px);width:260px;z-index:70;background:transparent;padding:8px;border-radius:10px}
    .side-panel.hidden{display:none}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:10px;padding:10px 12px;cursor:pointer;border:1px solid rgba(255,255,255,0.03);transition:transform .12s ease, box-shadow .12s ease}
    .card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,0.45)}
    .card h4{margin:0}
    .ttl{font-size:14.5px;color:var(--text);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .card .desc{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.5;white-space:pre-line}
    .translationPreview{background:rgba(42,140,255,0.06);padding:8px;border-radius:8px;margin-top:6px}
    @media (min-width:900px){ .app{margin-left:300px;max-width:calc(100% - 320px);} }
    @media (max-width:899px){ .side-panel{position:static;width:100%;top:auto;margin:8px 12px 0 12px} .app{margin-left:0} }
    /* make header fixed so it stays visible in Telegram WebView */
    header{position:fixed;top:0;left:0;right:0;z-index:60;background:linear-gradient(180deg, rgba(6,10,20,0.98), rgba(6,10,20,0.9));padding:calc(var(--tg-safe-top) + 14px) 14px 14px}
    main{height:calc(100vh - var(--header-h));overflow:auto;padding:12px 18px 24px}
    .title-row{display:flex;align-items:center;justify-content:space-between}
    h1{font-size:18px;margin:0}
    .user{color:var(--muted);font-size:13px;margin-top:6px}
    .news-list{display:flex;flex-direction:column;gap:8px}
    .meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted);gap:6px 10px}
    /* Structured stats for link-only posts (e.g. Hacker News) that carry no article text —
       shown as compact pills instead of dumping raw "Points: N / # Comments: N" text. */
    .stats{display:flex;gap:6px;flex-wrap:wrap}
    .stat{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);background:rgba(255,255,255,0.04);padding:2px 7px;border-radius:999px}
    .stat.points{color:#ffb84d}
    .stat.comments{color:#7fb2ff}
    .btn{background:rgba(var(--accent-rgb),var(--btn-alpha));border:0;padding:8px 12px;border-radius:8px;color:var(--text);cursor:pointer;font-size:13px;transition:filter .12s ease, transform .08s ease}
    .btn:hover{filter:brightness(1.2)}
    .btn:active{transform:scale(0.96)}
    .btn:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.08)}
    .btn:focus-visible, .field:focus-visible, select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
    .modal-backdrop{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.55);z-index:100;padding:calc(var(--tg-safe-top) + 24px) 12px 24px;box-sizing:border-box}
    /* Long article text can grow past the viewport — the modal scrolls internally instead of
       the whole box overflowing off-screen (which used to hide the close button entirely). */
    .modal{background:var(--surface);border-radius:12px;max-width:820px;width:94%;max-height:100%;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,0.65);color:var(--text);position:relative}
    .modal-topbar{position:sticky;top:0;display:flex;justify-content:flex-end;padding:10px 10px 0;background:var(--surface);z-index:2}
    .modal-content{padding:0 16px 16px}
    .modal-content h3{margin:0;font-size:17px;line-height:1.4}
    .modal .close{background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:4px 6px;border-radius:6px}
    .modal .close:hover{color:var(--text);background:rgba(255,255,255,0.06)}
    /* Status toast for setStatus() — brief, non-blocking feedback, styled to match the dark theme */
    .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--surface);border:1px solid rgba(255,255,255,0.08);color:var(--text);padding:9px 16px;border-radius:999px;z-index:200;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,0.5);max-width:90%;text-align:center}
    .empty-state{color:var(--muted);text-align:center;padding:40px 16px;font-size:14px}
    .skeleton{height:14px;background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.04));border-radius:6px}
    /* Shared text-input styling (source URL field, API key field, …) */
    .field{width:100%;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.02);color:var(--text);font-size:14px;box-sizing:border-box}
    .field::placeholder{color:var(--muted)}
    .source-select{background:var(--surface);color:var(--text);border:1px solid rgba(255,255,255,0.08);padding:8px 10px;border-radius:8px;font-size:14px}
    a{color:inherit}
  </style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <div class="title-row">
        <div>
          <h1>Моя лента</h1>
          <div class="user" id="userInfo">Загрузка…</div>
        </div>
        <!-- Sits in the header's own flow (not position:fixed) so it always lines up with the
             title regardless of how much space Telegram's safe area ends up reserving above. -->
        <button id="btnTogglePanel" class="btn ghost" title="Показать/скрыть панель" aria-label="Показать/скрыть панель">☰</button>
      </div>
  </header>

    <!-- ADDED: Side control panel — moved controls here so they do not overlap news -->
    <aside id="controlPanel" class="side-panel" aria-hidden="false">
      <div style="background:rgba(255,255,255,0.01);padding:10px;border-radius:8px">
        <div style="margin-bottom:8px"><label style="font-size:13px;color:var(--muted)">Источник</label><br /><select id="sourceSelect" class="source-select" aria-label="Выбор источника" style="width:100%"></select></div>
        <div style="margin-bottom:8px"><input id="inputFeed" class="field" placeholder="rss:https://example.com/feed.xml или https://api.example.com/news.json" /></div>
        <div style="display:flex;gap:8px;align-items:center">
         <button id="btnLoad" class="btn" style="flex:1">Загрузить</button>
         <button id="btnLoadMore" class="btn ghost">Загрузить ещё</button>
        </div>
        <div style="margin-top:12px;display:flex;gap:8px;flex-direction:column">
         <button id="btnSettings" class="btn ghost">⚙️ Настройки</button>
         <button id="btnCloseSide" class="btn ghost">Закрыть</button>
        </div>
      </div>
    </aside>

    <main>
      <div id="news" class="news-list"></div>
    </main>
  </div>

  <!-- Compact list row: just a headline + one meta line. Everything else (full text,
       translate, original link) lives in the detail modal that opens on click. -->
  <template id="cardTpl">
    <div class="card">
      <h4 class="ttl"></h4>
      <p class="desc" style="display:none"></p>
      <div class="meta">
        <div class="source"></div>
        <div class="stats"></div>
      </div>
      <button class="btn ghost btnExpand" style="margin-top:8px;font-size:12px;padding:5px 10px">Раскрыть</button>
    </div>
  </template>

  <!-- ADDED: settings modal -->
  <div id="modalSettings" class="modal-backdrop" style="display:none" role="dialog" aria-modal="true">
    <div class="modal" role="document" style="max-width:420px">
      <button class="close" id="settingsClose" aria-label="Закрыть">✕</button>
      <h3>Настройки</h3>
        <div style="margin-top:8px">
          <label style="display:block;margin-bottom:6px;font-size:13px;color:var(--muted)">OpenAI API Key</label>
          <input id="inputApiKey" class="field" placeholder="sk-..." />
          <!-- Free fallback translator used when no OpenAI key is set -->
          <div style="margin-top:8px;font-size:13px;color:var(--muted)"><label><input type="checkbox" id="usePublicTranslate"> Использовать публичный переводчик (без API-ключа)</label></div>
        <div style="display:flex;gap:8px;margin-top:8px;justify-content:flex-end">
          <button id="saveApiKey" class="btn">Сохранить</button>
          <button id="clearApiKey" class="btn ghost">Очистить ключ</button>
          <button id="clearCache" class="btn ghost">Очистить кэш</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modalRoot" style="display:none"></div>
  <!-- Brief status toast (loading/error/success messages), populated by setStatus() -->
  <div id="statusToast" class="toast" style="display:none"></div>

  <script>
    // Minimal Telegram.WebApp shim for local testing
    window.Telegram = window.Telegram || { WebApp: { initData: null, initDataUnsafe: {}, platform: 'web' }};

  // LocalStorage keys
  const LS_LAST = 'tg_minapp_last_v1';

    // Config: change to your feed. Supports 'rss:<URL>' or 'https://.../json'
    let fetchUrl = 'rss:https://rss.nytimes.com/services/xml/rss/nyt/World.xml';

    // Selected source storage
    const LS_SRC = 'tg_minapp_src_v1';

    // Available sources (id, name, url). URLs are prefixed with 'rss:' when they are RSS feeds.
    const SOURCES = [
      {id:'bbc', name:'BBC News', url:'rss:https://feeds.bbci.co.uk/news/rss.xml'},
      {id:'cnn', name:'CNN', url:'rss:http://rss.cnn.com/rss/edition.rss'},
      {id:'guardian', name:'The Guardian', url:'rss:https://www.theguardian.com/world/rss'},
      {id:'reuters', name:'Reuters', url:'rss:https://www.reuters.com/tools/rss'},
      {id:'aljazeera', name:'Al Jazeera', url:'rss:https://www.aljazeera.com/xml/rss/all.xml'},
      {id:'bloomberg', name:'Bloomberg', url:'rss:https://www.bloomberg.com/feed/podcast/etf.xml'},
      {id:'techcrunch', name:'TechCrunch', url:'rss:https://techcrunch.com/feed/'},
      {id:'verge', name:'The Verge', url:'rss:https://www.theverge.com/rss/index.xml'},
      {id:'hn', name:'Hacker News', url:'rss:https://hnrss.org/frontpage'},
      {id:'coindesk', name:'CoinDesk', url:'rss:https://www.coindesk.com/arc/outboundfeeds/rss/'},
      {id:'cointelegraph', name:'CoinTelegraph', url:'rss:https://cointelegraph.com/rss'},
      {id:'ft', name:'Financial Times', url:'rss:https://www.ft.com/?format=rss'},
      {id:'nytimes', name:'The New York Times', url:'rss:https://rss.nytimes.com/services/xml/rss/nyt/World.xml'},
      {id:'ap', name:'Associated Press', url:'rss:https://apnews.com/hub/ap-top-news?outputType=RSS'},
      {id:'npr', name:'NPR', url:'rss:https://feeds.npr.org/1001/rss.xml'},
      {id:'wired', name:'Wired', url:'rss:https://www.wired.com/feed/rss'},
      {id:'arstechnica', name:'Ars Technica', url:'rss:http://feeds.arstechnica.com/arstechnica/index'},
      {id:'engadget', name:'Engadget', url:'rss:https://www.engadget.com/rss.xml'},
      {id:'euronews', name:'Euronews', url:'rss:https://www.euronews.com/rss?level=2&name=home'},
      {id:'dw', name:'DW', url:'rss:https://rss.dw.com/rdf/rss-en-all'},
      {id:'guardian-tech', name:'The Guardian - Tech', url:'rss:https://www.theguardian.com/uk/technology/rss'},
      {id:'techmcr', name:'Techmeme', url:'rss:https://www.techmeme.com/feed.xml'},
      {id:'eng', name:'Engage (examples)', url:'rss:https://feeds.feedburner.com/TechCrunch/'},
      {id:'bbc-world', name:'BBC World', url:'rss:https://feeds.bbci.co.uk/news/world/rss.xml'}
    ];

    // Populate the source selector and wire persistence
    function loadSources(){
      const sel = document.getElementById('sourceSelect'); if(!sel) return;
      sel.innerHTML = '';
      const placeholder = document.createElement('option'); placeholder.value = ''; placeholder.textContent = 'Выберите источник...'; sel.appendChild(placeholder);
      SOURCES.forEach(s=>{ const o = document.createElement('option'); o.value = s.id; o.textContent = s.name; sel.appendChild(o); });
      // restore selection
      const saved = localStorage.getItem(LS_SRC);
      if(saved){ sel.value = saved; const src = SOURCES.find(x=>x.id===saved); if(src){ fetchUrl = src.url; document.getElementById('inputFeed').value = fetchUrl; }}
      sel.addEventListener('change', (e)=>{
        const id = e.target.value; if(!id) return;
        localStorage.setItem(LS_SRC, id);
        const src = SOURCES.find(x=>x.id===id);
        if(src){
          // clear current list immediately for UX, then load new source
          news = []; displayedCount = 0; renderNews();
          fetchUrl = src.url; document.getElementById('inputFeed').value = fetchUrl; loadNews(src.url);
        }
      });
  // selection change already triggers load; no top reload button present
    }

    // Load news by source id (modular entrypoint)
    function loadNewsById(sourceId){
      const src = SOURCES.find(s=>s.id === sourceId);
      if(!src){ setStatus('Источник не найден'); return; }
      try{ localStorage.setItem(LS_SRC, sourceId); fetchUrl = src.url; document.getElementById('inputFeed').value = fetchUrl; news = []; displayedCount = 0; renderNews(); loadNews(src.url); }
      catch(e){ console.error('loadNewsById', e); setStatus('Ошибка при загрузке источника'); }
    }

  // Small mock fallback
  const BASE_NEWS = [{id:'m1',title:'Пример новости',summary:'Короткое описание',translation_ru: undefined,link:'#',source:'Пример'}];

  let news = [];
  let isLoading = false;
  // pagination / UI state
  const PAGE_SIZE = 10;
  let displayedCount = 0; // how many items currently rendered

  const $ = (sel,root=document)=>root.querySelector(sel);

    // Utilities
  // lightweight status: log + show debug banner if exists
  let statusHideTimer = null;
  function setStatus(text){
    try{
      const toast = document.getElementById('statusToast');
      if(toast){
        toast.style.display = 'block'; toast.textContent = text;
        if(statusHideTimer) clearTimeout(statusHideTimer);
        statusHideTimer = setTimeout(()=>{ toast.style.display = 'none'; }, 2500);
      }
    }catch(e){}
    console.log('[status]', text);
  }

    // Fetch helpers
    async function fetchWithTimeout(url, opts={}, ms=12000){
      const controller = new AbortController();
      const id = setTimeout(()=>controller.abort(), ms);
      try{ const res = await fetch(url, {...opts, signal:controller.signal}); clearTimeout(id); return res; } catch(e){ clearTimeout(id); throw e; }
    }

    // Map parsed RSS/Atom <item>/<entry> nodes into our article shape.
    // Some feeds (e.g. hnrss.org) don't carry article text at all — their <description> is just
    // "Article URL / Comments URL / Points / # Comments" boilerplate. Dumping that as a summary
    // reads as broken text, so we detect it and turn it into proper structured stats instead.
    function parseLinkPostMeta(rawHtml){
      if(!rawHtml) return null;
      const pointsMatch = rawHtml.match(/Points:\s*(\d+)/i);
      const commentsCountMatch = rawHtml.match(/#\s*Comments:\s*(\d+)/i);
      if(!pointsMatch && !commentsCountMatch) return null;
      const commentsUrlMatch = rawHtml.match(/Comments URL:\s*<a[^>]*href="([^"]+)"/i);
      return {
        points: pointsMatch ? parseInt(pointsMatch[1],10) : null,
        commentsCount: commentsCountMatch ? parseInt(commentsCountMatch[1],10) : null,
        commentsUrl: commentsUrlMatch ? commentsUrlMatch[1] : null
      };
    }

    // Shared shape-builder for an article, used by every feed source (raw RSS/Atom XML,
    // rss2json, and plain custom JSON feeds) so the linkMeta/safeSummary logic — and any
    // future fix to it — lives in exactly one place instead of three near-identical copies.
    // Aggregator feeds like Techmeme point <link> at their OWN permalink page (a page that's
    // just a list of the day's headlines), while the real publisher's URL is only mentioned as
    // an <a href> inside the description. Trying to parse the aggregator's own page for full
    // text (a) can never work (it's a links list, not an article) and (b) our looksLikeNavJunk
    // check correctly rejects it — so it silently does nothing. Prefer that embedded external
    // link whenever it points to a different site than the feed's own link.
    function extractExternalLink(rawHtml, ownLink){
      if(!rawHtml) return null;
      const match = rawHtml.match(/<a[^>]*href="(https?:\/\/[^"]+)"/i);
      if(!match) return null;
      try{
        const candidateHost = new URL(match[1]).host;
        const ownHost = ownLink ? new URL(ownLink).host : null;
        if(ownHost && candidateHost === ownHost) return null;
        return match[1];
      }catch(e){ return null; }
    }

    function buildArticle({ id, rawTitle, rawSummary, link, source, commentsUrl }){
      rawTitle = rawTitle || 'Без названия';
      rawSummary = rawSummary || '';
      const linkMeta = parseLinkPostMeta(rawSummary);
      const safeSummary = linkMeta ? '' : (sanitizeSummary(rawSummary) || sanitizeSummary(rawTitle) || '');
      const resolvedLink = extractExternalLink(rawSummary, link) || link || '#';
      return {
        id,
        title: sanitizeSummary(rawTitle) || 'Без названия',
        summary: safeSummary,
        points: linkMeta ? linkMeta.points : null,
        commentsCount: linkMeta ? linkMeta.commentsCount : null,
        commentsUrl: commentsUrl || (linkMeta && linkMeta.commentsUrl) || null,
        translation_ru: undefined,
        link: resolvedLink,
        source: source || 'RSS'
      };
    }

    function mapRssXmlItems(doc){
      const items = Array.from(doc.querySelectorAll('item,entry'));
      if(!items.length) throw new Error('no items parsed from RSS');
      const feedTitle = doc.querySelector('channel > title')?.textContent || 'RSS';
      return items.map((it,i)=>{
        const rawTitle = it.querySelector('title')?.textContent;
        return buildArticle({
          id: 'rss-' + (it.querySelector('guid')?.textContent || i + '-' + (rawTitle||'')),
          rawTitle,
          rawSummary: it.querySelector('description')?.textContent || it.querySelector('summary')?.textContent || '',
          link: it.querySelector('link')?.textContent || it.querySelector('id')?.textContent || '#',
          source: feedTitle,
          commentsUrl: it.querySelector('comments')?.textContent
        });
      });
    }

    async function fetchViaAllOriginsRaw(rssUrl){
      const res = await fetchWithTimeout('https://api.allorigins.win/raw?url=' + encodeURIComponent(rssUrl), {}, 9000);
      if(!res.ok) throw new Error('allorigins-raw returned ' + res.status);
      const txt = await res.text();
      return mapRssXmlItems(new DOMParser().parseFromString(txt, 'application/xml'));
    }

    async function fetchViaAllOriginsJson(rssUrl){
      const res = await fetchWithTimeout('https://api.allorigins.win/get?url=' + encodeURIComponent(rssUrl), {}, 9000);
      if(!res.ok) throw new Error('allorigins-json returned ' + res.status);
      const j = await res.json();
      const txt = (j && (j.contents || j.contents_text || j.contents_html)) || JSON.stringify(j);
      return mapRssXmlItems(new DOMParser().parseFromString(txt, 'application/xml'));
    }

    // rss2json is purpose-built for RSS (no XML parsing needed) and is often faster than a generic CORS proxy.
    async function fetchViaRss2Json(rssUrl){
      const res = await fetchWithTimeout('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(rssUrl), {}, 9000);
      if(!res.ok) throw new Error('rss2json returned ' + res.status);
      const j = await res.json();
      if(j.status !== 'ok' || !Array.isArray(j.items) || !j.items.length) throw new Error('rss2json: no items');
      const feedTitle = (j.feed && j.feed.title) || 'RSS';
      return j.items.map((it,i)=>buildArticle({
        id: 'rss-' + (it.guid || i + '-' + (it.title||'')),
        rawTitle: it.title,
        rawSummary: it.description || '',
        link: it.link || '#',
        source: feedTitle
      }));
    }

    async function fetchRssViaAllOrigins(rssUrl){
      // Fire all sources in parallel and take whichever succeeds first — much faster
      // than the old sequential retry loop, since a slow/rate-limited proxy no longer
      // blocks the others.
      setStatus('Загрузка (несколько источников параллельно)...');
      try{
        const items = await Promise.any([
          fetchViaRss2Json(rssUrl),
          fetchViaAllOriginsRaw(rssUrl),
          fetchViaAllOriginsJson(rssUrl)
        ]);
        setStatus('Готово');
        return items;
      }catch(aggErr){
        console.warn('fetchRssViaAllOrigins: all sources failed', aggErr);
        setStatus('Ошибка загрузки RSS (все источники недоступны)');
        throw (aggErr && aggErr.errors && aggErr.errors[0]) || aggErr;
      }
    }

    async function loadNews(url){
      isLoading = true; renderNews();
      setStatus('Загрузка...');
      let items = [];
      try{
        if(!url) url = fetchUrl;
        if(url.startsWith('rss:')){
          const r = url.slice(4);
          items = await fetchRssViaAllOrigins(r);
        } else {
          const res = await fetchWithTimeout(url, {}, 12000);
          items = await res.json();
          // normalize if coming as {items:[]}
          if(Array.isArray(items.items)) items = items.items;
          items = items.map((it,i)=>buildArticle({
            id: it.id || it.guid || 'j-' + i,
            rawTitle: it.title || it.name,
            rawSummary: it.summary || it.description || it.excerpt || '',
            link: it.url || it.link || '#',
            source: it.source || it.feed || 'JSON'
          }));
        }
        news = items.length ? items : BASE_NEWS;
        // reset pagination
        displayedCount = Math.min(PAGE_SIZE, news.length);
        localStorage.setItem(LS_LAST, JSON.stringify(news));
        setStatus('Готово');
      } catch(err){
        console.error('loadNews', err);
        setStatus('Ошибка, используем кэш');
        const cached = JSON.parse(localStorage.getItem(LS_LAST) || 'null');
        news = cached && cached.length ? cached : BASE_NEWS;
        displayedCount = Math.min(PAGE_SIZE, news.length);
      } finally{
        isLoading = false; renderNews();
      }
    }

    // Render
    // Renders points/comments-count pills for link-only posts (see parseLinkPostMeta).
    function renderStats(container, it){
      container.innerHTML = '';
      if(typeof it.points === 'number'){
        const s = document.createElement('span'); s.className = 'stat points'; s.textContent = '▲ ' + it.points;
        container.appendChild(s);
      }

    /* ADDED: Translation prompt builder and requestTranslate moved into main script (was previously injected into template) */
    function buildTranslationPrompt(text){
      // gpt-5-mini easily handles a full article in one request — cap only matches the
      // max length we ever extract (see fetchArticleExcerpt), not an arbitrary short blurb.
      const snippet = (text || '').toString().trim().slice(0, 8000);
      return `Переведи ТОЛЬКО на русский язык следующий текст. Нельзя добавлять заголовки, комментарии или факты, которых нет в тексте. Ответь строго в JSON: {"translation_ru":"..."}. Текст:\n${snippet}`;
    }

    const LS_USE_PUBLIC_TRANSLATE = 'tg_minapp_use_public_translate';
    // Default to on: translation should work out of the box, without requiring a paid API key.
    function publicTranslateEnabled(){ return localStorage.getItem(LS_USE_PUBLIC_TRANSLATE) !== '0'; }

    // MyMemory's free tier hard-caps a single request at 500 chars (longer ones get rejected
    // outright), so a full article has to go over in chunks — split on sentence boundaries
    // where possible so we don't cut mid-sentence.
    function splitIntoChunks(text, maxLen){
      const sentences = text.match(/[^.!?\n]+[.!?\n]*/g) || [text];
      const chunks = []; let current = '';
      for(const s of sentences){
        if((current + s).length > maxLen){
          if(current) chunks.push(current.trim());
          if(s.length > maxLen){
            for(let i=0;i<s.length;i+=maxLen) chunks.push(s.slice(i,i+maxLen).trim());
            current = '';
          } else { current = s; }
        } else { current += s; }
      }
      if(current.trim()) chunks.push(current.trim());
      return chunks.filter(Boolean);
    }

    // Free translation fallback via MyMemory's public API (no key required).
    async function publicTranslate(text){
      const q = text.slice(0, 500); // defense-in-depth; callers should already chunk to this size
      const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(q) + '&langpair=en|ru';
      const res = await fetchWithTimeout(url, {}, 10000);
      if(!res.ok) throw new Error('mymemory returned ' + res.status);
      const j = await res.json();
      const out = j && j.responseData && j.responseData.translatedText;
      if(!out) throw new Error('mymemory: empty translation');
      return out;
    }

    // Translate arbitrarily long text via MyMemory by chunking it and translating each
    // piece in turn, then stitching the results back together.
    async function publicTranslateLong(text){
      const chunks = splitIntoChunks(text, 450);
      const results = new Array(chunks.length);
      // A handful of chunks in flight at once — fast enough that a full article doesn't take
      // one round-trip per chunk, without hammering a free, unauthenticated API with an
      // unbounded burst of concurrent requests.
      const CONCURRENCY = 3;
      let next = 0;
      async function worker(){
        while(next < chunks.length){
          const i = next++;
          results[i] = await publicTranslate(chunks[i]);
        }
      }
      await Promise.all(Array.from({ length: Math.min(CONCURRENCY, chunks.length) }, worker));
      return results.join(' ').replace(/\s+/g,' ').trim();
    }

    async function requestTranslate(article){
      if(!article) throw new Error('article required');
      if(article.translation_ru !== undefined) return;
      // article.summary is already vetted upstream (sanitizeSummary at RSS ingestion, or
      // looksLikeNavJunk for extracted article text) — re-running the short-blurb
      // isLikelyCode() heuristic here used to reject any normal paragraph over 300 chars
      // and silently fall back to translating just the title.
      const text = article.summary || article.title || '';
      if(!text || text.trim().length < 10){ article.translation_ru = ''; return; }
      const apiKey = (window.OPENAI_API_KEY || localStorage.getItem('OPENAI_API_KEY') || '').trim();
      if(!apiKey){
        if(!publicTranslateEnabled()){ setStatus('Введите OpenAI API-ключ или включите публичный переводчик в Настройках'); article.translation_ru = ''; return; }
        try{
          setStatus('Запрос к публичному переводчику...');
          const translated = await publicTranslateLong(text);
          article.translation_ru = translated.slice(0,8000).trim();
          setStatus('Перевод готов (публичный переводчик)');
        }catch(e){
          console.warn('publicTranslate failed', e);
          setStatus('Публичный переводчик недоступен');
          article.translation_ru = '';
        }
        return;
      }
      const prompt = buildTranslationPrompt(text);
      const body = JSON.stringify({ model: 'gpt-5-mini', temperature: 0.2, input: prompt });
      try{
        const res = await fetchWithTimeout('https://api.openai.com/v1/responses', { method: 'POST', headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + apiKey }, body }, 20000);
        if(!res.ok) throw new Error('OpenAI error ' + res.status);
        const j = await res.json();
        let outText = '';
        if(Array.isArray(j.output) && j.output.length){ const o = j.output.find(x=>x.content_type==='output_text') || j.output[0]; outText = (o && (o.content || o.text)) || (typeof o === 'string' ? o : ''); }
        else if(j.result && j.result.length) outText = j.result[0];
        else if(typeof j.output === 'string') outText = j.output;
        else outText = JSON.stringify(j);
        let parsed = null;
        try{ const start = outText.indexOf('{'); const end = outText.lastIndexOf('}'); if(start >= 0 && end > start) parsed = JSON.parse(outText.slice(start, end+1)); else parsed = JSON.parse(outText); }
        catch(e){ console.warn('Failed to parse translation JSON', e); }
        if(parsed && typeof parsed.translation_ru === 'string'){ parsed.translation_ru = parsed.translation_ru.trim().replace(/\s+/g,' '); article.translation_ru = parsed.translation_ru.slice(0,8000).trim(); }
        else { article.translation_ru = ''; }
      }catch(err){ console.error('requestTranslate error', err); article.translation_ru = ''; setStatus('Ошибка при получении перевода'); return; }
    }

    // Modal — the single place for everything about an article: full text, stats,

      renderStats(modal.querySelector('#modalStats'), it);
      if(it.commentsUrl){ const commentsLink = modal.querySelector('#commentsLink'); commentsLink.href = it.commentsUrl; commentsLink.style.display = 'inline-block'; }

      // Show whatever text we already have immediately, then try to fetch the full article
      // text in the background and upgrade in place — best-effort, never blocks the modal.
      const bodyEl = modal.querySelector('#modalBody');
      if(it.summary) renderExpandableText(bodyEl, it.summary);
      else bodyEl.textContent = it.link && it.link.startsWith('http') ? 'Загружаем текст статьи…' : '';
      const articlePromise = ensureArticleFetch(it);
      if(articlePromise){
        articlePromise.then(summary=>{

        }).catch(err=>{
          console.warn('fetchArticleExcerpt failed', err);

      // Translation

      if(it.translation_ru === '') transBtn.disabled = true;
      transBtn.addEventListener('click', async ()=>{

          if(it.translation_ru){ renderExpandableText(translationEl, it.translation_ru); wrapper.style.display = 'block'; setStatus('Перевод загружен из кеша'); }
          else { wrapper.style.display = 'none'; transBtn.disabled = true; setStatus('Перевод отсутствует'); }
          return;
        }
        if(it._translatePending) return; it._translatePending = true; transBtn.disabled = true; const prevT = transBtn.textContent; transBtn.textContent = '...'; setStatus('Запрос перевода...');
        try{

    function escCloseHandler(e){ if(e.key === 'Escape') closeDetail(); }
    function closeDetail(){ const root = $('#modalRoot'); root.style.display='none'; root.innerHTML=''; document.removeEventListener('keydown', escCloseHandler); }

    // Paywalled/JS-heavy sites (e.g. FT) often serve Reader a nav-only stub instead of the
    // article — lots of "* Section name" bullet lines and repeated "Sections"/"Most Read"
    // headings. Reject that instead of showing site-menu garbage as if it were the article.
    function looksLikeNavJunk(text){
      const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
      if(!lines.length) return true;
      const bulletLines = lines.filter(l=>/^\*\s/.test(l)).length;
      if(bulletLines / lines.length > 0.3) return true;
      if((text.match(/^Most Read$/gm) || []).length >= 2) return true;
      if((text.match(/^Sections$/gm) || []).length >= 2) return true;
      // Bot-block / WAF interstitial pages (Cloudflare, etc.) served instead of the article —
      // e.g. Techmeme returning "Why have I been blocked?" to the Reader proxy.
      const lower = text.toLowerCase();
      const blockMarkers = [
        'why have i been blocked',
        'this website is using a security service',
        'cloudflare ray id',
        'checking your browser before accessing',
        'please enable javascript and cookies',
        'verify you are a human'
      ];
      if(blockMarkers.some(m => lower.includes(m))) return true;
      return false;
    }

    // Best-effort full-text extraction: RSS feeds usually give only a short blurb (or, for
    // Hacker News, nothing at all). To show as much real text as we can, run the article's
    // own URL through Jina AI's public Reader proxy (r.jina.ai), which fetches the page and
    // returns its already-extracted, readable text — no HTML parsing needed on our side.
    async function fetchArticleExcerpt(url){
      const res = await fetchWithTimeout('https://r.jina.ai/' + url, {}, 10000);
      if(!res.ok) throw new Error('article fetch failed ' + res.status);
      const raw = await res.text();
      // Reader prefixes the content with "Title: / URL Source: / Markdown Content:" — keep only the body.
      const marker = 'Markdown Content:';
      let text = raw.includes(marker) ? raw.slice(raw.indexOf(marker) + marker.length) : raw;
      text = text
        .replace(/!\[[^\]]*\]\([^)]*\)/g, '')      // strip markdown images
        .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')   // unwrap markdown links to plain text
        .replace(/\n{3,}/g, '\n\n')
        .trim();
      if(!text) throw new Error('no readable text extracted');
      if(looksLikeNavJunk(text)) throw new Error('extracted content looks like site navigation, not an article');
      // A generous ceiling against pathologically long pages — the UI reveals this
      // progressively (see renderExpandableText), so most real articles fit well within it
      // without ever hitting the cap.
      if(text.length > 8000) text = text.slice(0,8000).trim() + '…';
      return text;
    }

    // Shows `text` truncated to `limit` chars with a "Читать дальше" button that reveals the
    // rest in place — no extra network request, since we already have the full text from one
    // fetch. Falls back to plain full text when it's already short enough to not need this.
    function renderExpandableText(el, text, limit){
      limit = limit || 1800;
      el.textContent = '';
      if(!text || text.length <= limit){ el.textContent = text || ''; return; }
      const shortPart = document.createElement('span');
      shortPart.textContent = text.slice(0, limit).trim() + '… ';
      const moreBtn = document.createElement('button');
      moreBtn.type = 'button';
      moreBtn.className = 'btn ghost';
      moreBtn.style.cssText = 'font-size:12px;padding:3px 10px;margin-top:6px';
      moreBtn.textContent = 'Читать дальше';
      moreBtn.addEventListener('click', (ev)=>{ ev.stopPropagation(); el.textContent = text; });
      el.appendChild(shortPart);
      el.appendChild(document.createElement('br'));
      el.appendChild(moreBtn);
    }

    // Kicks off (once per item) the background fetch of the full article text and returns its
    // shared promise — used by both the card's "Раскрыть" button and the detail modal, so
    // whichever triggers it first, the other reuses the same in-flight/resolved fetch instead
    // of hitting the Reader proxy twice for the same article.
    function ensureArticleFetch(it){
      if(!it.link || !it.link.startsWith('http')) return null;
      if(!it._articleFetchPromise){
        it._articleFetchPromise = fetchArticleExcerpt(it.link).then(text=>{
          if(text.length > (it.summary || '').length){ it.summary = text; }
          return it.summary;
        });
      }
      return it._articleFetchPromise;
    }

    // Simple escaping
    function escapeHtml(s){ if(!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    // ADDED: helpers to detect and sanitize code-like or injected content in summaries
    function isLikelyCode(text){
      if(!text) return false;
      const t = text.toString();
      // Markers specific enough that ordinary news prose won't contain them by coincidence —
      // catches our own leaked prompt/code strings or obvious script injection. Deliberately
      // NOT flagging generic words like "function"/"=>" or "any single line over 300 chars":
      // real RSS descriptions are routinely one long unbroken paragraph, and tech articles
      // routinely say "function" — those false-positives were silently blanking legitimate
      // titles/summaries (including at boot, when restoring the cached list).
      const markers = ['ADDED:', 'MODIFIED', 'module.exports', '<script', 'buildSummaryPrompt', 'requestTranslate', 'requestSummary', 'window.OPENAI_API_KEY'];
      for(const m of markers) if(t.indexOf(m) !== -1) return true;
      // A dense cluster of braces/angle-brackets is still a solid signal of raw code/markup
      // leaking into a short RSS blurb.
      const braceCount = (t.match(/[{}<>]/g) || []).length;
      if(braceCount > 10) return true;
      return false;
    }

    function sanitizeSummary(text){
      if(!text) return '';
      const s = text.replace(/<[^>]+>/g,'').trim();
      if(isLikelyCode(s)) return '';
      return s.replace(/\s+/g,' ').trim();
    }

    // Bind UI
  const btnLoadEl = document.getElementById('btnLoad'); if(btnLoadEl) btnLoadEl.addEventListener('click', ()=>{ const v = document.getElementById('inputFeed').value.trim(); if(v) { fetchUrl = v; loadNews(fetchUrl); } else loadNews(); });
  function setPanelHidden(hidden){ const sp = document.getElementById('controlPanel'); if(!sp) return; sp.classList.toggle('hidden', hidden); sp.setAttribute('aria-hidden', String(hidden)); }
  const togglePanelBtn = document.getElementById('btnTogglePanel'); if(togglePanelBtn) togglePanelBtn.addEventListener('click', ()=>{ const sp = document.getElementById('controlPanel'); if(!sp) return; setPanelHidden(!sp.classList.contains('hidden')); });
  // Load more button
  const loadMoreBtn = document.getElementById('btnLoadMore'); if(loadMoreBtn){ loadMoreBtn.addEventListener('click', ()=>{ if(!news || !news.length) return; displayedCount = Math.min(news.length, displayedCount + PAGE_SIZE); renderNews(); }); }

    // Keep --header-h in sync with the real header height so .app/.side-panel/main
    // never guess a fixed pixel value that drifts when the header content wraps.
    function syncHeaderHeight(){
      const header = document.querySelector('header');
      if(!header) return;
      document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px');
    }

    // Inside real Telegram, the client draws its own bar (close/expand/menu) plus the device's
    // own status bar/notch OVER the top of our WebView — neither is part of our DOM, so nothing
    // we render can appear there. Telegram reports how much space that eats via safeAreaInset
    // (device notch/status bar) and contentSafeAreaInset (Telegram's own bar on top of that);
    // we push our fixed header down by their sum so our title/controls never render underneath.
    function syncTelegramSafeArea(){
      const wa = window.Telegram && window.Telegram.WebApp;
      if(!wa) return;
      const a = wa.safeAreaInset || {}; const b = wa.contentSafeAreaInset || {};
      const top = (a.top || 0) + (b.top || 0);
      document.documentElement.style.setProperty('--tg-safe-top', top + 'px');
      syncHeaderHeight();
    }

    // Show the Telegram user's name once, instead of leaving the "Загрузка…" placeholder forever
    function renderUserInfo(){
      const el = document.getElementById('userInfo'); if(!el) return;
      const user = window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user;
      if(user && (user.first_name || user.username)){
        el.textContent = [user.first_name, user.last_name].filter(Boolean).join(' ') || ('@' + user.username);
      } else {
        el.style.display = 'none';
      }
      syncHeaderHeight();
    }

    // Boot
    window.addEventListener('resize', syncHeaderHeight);
    window.addEventListener('load', ()=>{
      const wa = window.Telegram && window.Telegram.WebApp;
      if(wa){
        try{
          wa.ready();
          wa.expand(); // use the full viewport instead of Telegram's collapsed half-screen sheet
          if(wa.setHeaderColor) wa.setHeaderColor('#071022'); // blend Telegram's own bar with our theme
          wa.onEvent && wa.onEvent('safeAreaChanged', syncTelegramSafeArea);
          wa.onEvent && wa.onEvent('contentSafeAreaChanged', syncTelegramSafeArea);
        }catch(e){ console.warn('Telegram.WebApp init failed', e); }
      }
      syncTelegramSafeArea();
      syncHeaderHeight();
      renderUserInfo();
      // populate source selector and restore selection
      try{ loadSources(); }catch(e){ console.warn('loadSources failed', e); }
      // restore cached data
      try{ const cached = JSON.parse(localStorage.getItem(LS_LAST)||'null'); if(cached && cached.length){
          // sanitize cached items to avoid showing previously cached injected code
          news = cached.map(it=>({ ...it, title: sanitizeSummary(it.title), summary: sanitizeSummary(it.summary) } ))
                       .filter(it=> (it.title && it.title.length) || (it.summary && it.summary.length));
        } }catch(e){}
      // if a saved source exists, load it; otherwise show default fetchUrl
      const savedSrc = localStorage.getItem(LS_SRC);
      if(savedSrc){ document.getElementById('inputFeed').value = (SOURCES.find(s=>s.id===savedSrc)||{}).url || fetchUrl; renderNews(); loadNewsById(savedSrc); }
      else { document.getElementById('inputFeed').value = fetchUrl; renderNews(); loadNews(); }
    });

    // Global error handlers for debugging
    window.addEventListener('error', (e)=>{ console.error('Global error', e.error||e); });
    window.addEventListener('unhandledrejection', (e)=>{ console.error('Unhandled rejection', e.reason); });

  </script>
</body>
</html>
